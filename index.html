<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<!-- viewport-fit=cover: 노치/홈인디케이터 영역까지 캔버스를 채운다 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="SLOT SHOTS IDLE">
	<meta name="theme-color" content="#000000">
	<meta name="format-detection" content="telephone=no">
	<title>SLOT SHOTS IDLE</title>
	<style>
* { margin:0; padding:0; border:0; box-sizing:border-box; }

html, body {
	width:100%; height:100%;
	overflow:hidden;
	background-color:#242424;
	color:#fff;
	/* 모바일: 당겨서 새로고침·바운스 스크롤·롱프레스 선택/콜아웃을 전부 죽인다.
	   이 게임의 코어 제스처가 "길게 누르기 = 자동 강화"라 콜아웃 메뉴가 뜨면 조작이 깨진다. */
	overscroll-behavior:none;
	touch-action:none;
	-webkit-user-select:none; user-select:none;
	-webkit-touch-callout:none;
	-webkit-tap-highlight-color:transparent;
	font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}

/* 캔버스는 뷰포트 전체. dvh 를 쓰면 주소창이 접혔다 펴져도 잘리지 않는다. */
#canvas {
	display:block;
	position:fixed; inset:0;
	width:100%; height:100%;
	height:100dvh;
	outline:none;
	touch-action:none;
}

/* ---------- 부팅 오버레이 ---------- */
#boot {
	position:fixed; inset:0; z-index:10;
	display:flex; flex-direction:column; align-items:center; justify-content:center;
	gap:22px; padding:32px 28px calc(32px + env(safe-area-inset-bottom));
	background:radial-gradient(120% 90% at 50% 30%, #1b1226 0%, #000 70%);
	text-align:center;
	transition:opacity .35s ease;
}
#boot.gone { opacity:0; pointer-events:none; }

#boot-splash {
	max-width:min(56vw, 240px); max-height:44vh;
	border-radius:8px;
	object-fit:contain;
	image-rendering:pixelated;
	filter:drop-shadow(0 8px 30px rgba(0,0,0,.7));
}
#boot-splash.show-image--false { display:none; }

#boot-title { font-size:clamp(19px, 5.6vw, 26px); font-weight:800; letter-spacing:-.4px; }
#boot-sub   { font-size:clamp(12px, 3.4vw, 14px); color:#9b93ad; line-height:1.6; max-width:30em; }

#bar { width:min(74vw, 320px); height:7px; border-radius:99px; background:#241a33; overflow:hidden; }
#bar-fill { height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#8b5cf6,#f0b429); transition:width .18s linear; }
#bar-text { font-size:12px; color:#c8bfd8; font-variant-numeric:tabular-nums; letter-spacing:.3px; }
/* 빌드 정보 — 배포마다 자동으로 값이 채워진다(deploy_web_pages.sh). 조작을 방해하면
   안 되므로 흐름 밖에 고정하고 입력을 통과시킨다. */
#build-info {
	position:fixed; left:0; right:0; bottom:calc(6px + env(safe-area-inset-bottom));
	text-align:center; font-size:10px; color:#4e4859; letter-spacing:.3px;
	pointer-events:none; z-index:11;
}

/* ---------- 오류 안내 ---------- */
#status-notice {
	display:none;
	max-width:32em;
	background:#3a1f28; border:1px solid #9b3943; border-radius:10px;
	padding:16px 18px; font-size:13px; line-height:1.55; color:#f0dde0;
	white-space:pre-wrap; text-align:left;
}

/* ---------- 가로 모드 경고 ---------- */
#rotate {
	position:fixed; inset:0; z-index:20; display:none;
	flex-direction:column; align-items:center; justify-content:center; gap:16px;
	background:#000; color:#e8e2f2; font-size:16px; font-weight:700; text-align:center; padding:24px;
}
#rotate span { font-size:52px; line-height:1; animation:tilt 1.6s ease-in-out infinite; }
@keyframes tilt { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-90deg);} }
/* 세로가 기본인 게임이라, 짧고 넓은 화면(=가로로 든 폰)일 때만 띄운다. */
@media (orientation:landscape) and (max-height:520px) {
	body.playing #rotate { display:flex; }
}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>이 게임을 실행하려면 JavaScript가 필요합니다. / This game requires JavaScript to run. / このゲームの実行にはJavaScriptが必要です。</noscript>

	<div id="boot">
		<img id="boot-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
		<div id="boot-title">SLOT SHOTS IDLE</div>
		<div id="bar"><div id="bar-fill"></div></div>
		<div id="bar-text">불러오는 중…</div>
		<div id="boot-sub">
			세로로 들고 플레이하세요 · 소리를 켜면 더 좋습니다<br>
			첫 실행은 약 75MB를 내려받습니다 (Wi-Fi 권장)
		</div>
		<div id="status-notice"></div>
	</div>

	<!-- 배포 스크립트가 2026-08-31 · 2f1f7aa 를 실제 날짜·커밋으로 바꿔치기한다.
	     export 산출물을 직접 열어 보면(로컬 export) 이 자리표시자 그대로 보인다 — 정상이다.
	     #boot 밖에 둔다: 로딩 오버레이는 다 받으면 스스로 걷히고 그 자리를 게임 안 타이틀
	     화면이 받는데, 안에 두면 "어떤 빌드인가"가 타이틀을 보기도 전에 사라진다.
	     첫 탭(=타이틀 시작)과 함께 지운다 — 플레이 중에는 안 남는다. -->
	<div id="build-info">2026-08-31 · 2f1f7aa</div>

	<div id="rotate"><span>📱</span><span id="rotate-text">세로로 돌려주세요</span></div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":50792016,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// 게임에게 "아직 로딩 오버레이 뒤다"를 알린다.
//
// startGame() 은 페이지가 열리자마자 부른다 — 75MB 내려받기 진행률을 보여줘야 하기 때문이다.
// 그래서 게임은 이 오버레이 뒤에서 **이미 돌고 있다.** 내려받는 몇 초 동안 연구·에너지·적금이
// 흐르고 첫 화면 연출이 아무도 안 보는 채로 지나간다. 게임 쪽(scripts/Boot.gd)이 이 값을
// 폴링해 그동안 트리를 세우고, 다 받으면(아래 then) true 가 되어 타이틀 화면이 뜬다.
//
// **시작 버튼은 더 이상 여기 없다.** 그 역할은 게임 안 타이틀 화면이 맡는다
// (scripts/ui/TitleScreen.gd). 이 셸이 하는 일은 내려받기 진행률 표시까지다.
window.__slotStarted = false;

// ---- 부팅 오버레이 번역 ---------------------------------------------------
// 이 화면은 엔진 밖(순수 DOM)이라 게임 안 Locale.gd 의 locale/ui.csv 를 못 탄다.
// 그래서 브라우저 언어(navigator.language)를 직접 봐서 독립적으로 고른다 —
// 엔진이 뜬 뒤 Locale.gd 도 같은 값을 보고 고르므로 두 layer 가 자연히 맞아떨어진다.
const BOOT_STRINGS = {
	ko: {
		loading: '불러오는 중…',
		preparing: '준비 중…',
		subLine1: '세로로 들고 플레이하세요 · 소리를 켜면 더 좋습니다',
		subLine2: '첫 실행은 약 75MB를 내려받습니다 (Wi-Fi 권장)',
		rotate: '세로로 돌려주세요',
		error: '오류',
		failPrefix: '실행에 실패했습니다.\n\n',
		failSuffix: '\n\n최신 Chrome / Safari 로 다시 열어 보세요. 기기 메모리가 부족하면 다른 탭을 닫고 재시도하면 됩니다.',
		unsupportedPrefix: '이 브라우저가 지원하지 않는 기능: ',
	},
	en: {
		loading: 'Loading...',
		preparing: 'Preparing...',
		subLine1: 'Hold your device upright · Sound recommended',
		subLine2: 'First launch downloads about 75MB (Wi-Fi recommended)',
		rotate: 'Please rotate to portrait',
		error: 'Error',
		failPrefix: 'Failed to start.\n\n',
		failSuffix: '\n\nTry reopening in the latest Chrome or Safari. If your device is low on memory, close other tabs and try again.',
		unsupportedPrefix: "This browser doesn't support: ",
	},
	ja: {
		loading: '読み込み中…',
		preparing: '準備中…',
		subLine1: '端末を縦に持ってプレイしてください・音声をオンにするとより楽しめます',
		subLine2: '初回起動時は約75MBをダウンロードします（Wi-Fi推奨）',
		rotate: '端末を縦向きにしてください',
		error: 'エラー',
		failPrefix: '起動に失敗しました。\n\n',
		failSuffix: '\n\n最新のChromeまたはSafariで開き直してください。端末のメモリが不足している場合は、他のタブを閉じてから再試行してください。',
		unsupportedPrefix: 'このブラウザがサポートしていない機能: ',
	},
};

function detectBootLocale() {
	const supported = Object.keys(BOOT_STRINGS);
	const langs = (navigator.languages && navigator.languages.length)
		? navigator.languages
		: [navigator.language || navigator.userLanguage || 'ko'];
	for (const l of langs) {
		const primary = String(l).toLowerCase().split(/[-_]/)[0];
		if (supported.includes(primary)) { return primary; }
	}
	return 'ko';
}

const BOOT_LOCALE = detectBootLocale();
const S = BOOT_STRINGS[BOOT_LOCALE];
document.documentElement.lang = BOOT_LOCALE;
document.getElementById('bar-text').textContent = S.loading;
document.getElementById('boot-sub').innerHTML = S.subLine1 + '<br>' + S.subLine2;
document.getElementById('rotate-text').textContent = S.rotate;

(function () {
	const boot = document.getElementById('boot');
	const barFill = document.getElementById('bar-fill');
	const barText = document.getElementById('bar-text');
	const notice = document.getElementById('status-notice');

	// ---- 모바일 제스처 방역 -------------------------------------------------
	// 롱프레스 콜아웃 / 더블탭 확대 / 핀치 확대는 전부 게임 조작과 충돌한다.
	document.addEventListener('contextmenu', (e) => e.preventDefault(), { capture: true });
	document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
	document.addEventListener('selectstart', (e) => e.preventDefault());
	let lastTouchEnd = 0;
	document.addEventListener('touchend', (e) => {
		const now = Date.now();
		if (now - lastTouchEnd < 320) { e.preventDefault(); }
		lastTouchEnd = now;
	}, { passive: false });

	function fail(err) {
		console.error(err);
		const msg = (err instanceof Error) ? err.message : String(err);
		notice.textContent = S.failPrefix + msg + S.failSuffix;
		notice.style.display = 'block';
		barText.textContent = S.error;
		barFill.style.background = '#9b3943';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(S.unsupportedPrefix + missing.join(', '));
		return;
	}

	const MB = 1024 * 1024;
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, (current / total) * 100);
				barFill.style.width = pct.toFixed(1) + '%';
				barText.textContent = (current / MB).toFixed(1) + ' / ' + (total / MB).toFixed(1) + ' MB  ('
					+ pct.toFixed(0) + '%)';
			} else {
				barText.textContent = S.preparing;
			}
		},
	}).then(() => {
		barFill.style.width = '100%';
		// 다 받았으면 **스스로 걷힌다.** 시작 버튼은 이제 셸이 아니라 게임 안 타이틀 화면이다
		// (scripts/ui/TitleScreen.gd 머리주석: 시작 화면이 CSS 가 아니라 씬에 살아야 하는 이유).
		// 이 신호가 게임 쪽 부팅 게이트(scripts/Boot.gd)를 푼다 — 오버레이를 걷기 **전에**
		// 올려야 타이틀 첫 프레임이 사라지는 오버레이 뒤에 가려지지 않는다.
		window.__slotStarted = true;
		boot.classList.add('gone');
		document.body.classList.add('playing');
		setTimeout(() => boot.remove(), 400);
		document.getElementById('canvas').focus();

		// 서비스워커는 "게임이 이미 뜬 뒤에" 깐다. 초기 75MB 다운로드와 캐시 쓰기가
		// 겹치면 느린 회선에서 첫 진입만 더 늦어진다. 실패해도 게임에는 영향이 없다.
		if (GODOT_CONFIG['serviceWorker'] && 'serviceWorker' in navigator) {
			engine.installServiceWorker().catch((e) => console.warn('SW 설치 실패(무시 가능):', e));
		}
	}, fail);

	// 전체화면·방향고정은 **사람이 처음 화면을 건드리는 그 순간**에만 허용된다(브라우저 정책).
	// 그 손가락은 곧 타이틀 화면을 시작시키는 탭이다 — 같은 제스처를 셸과 게임이 나눠 쓴다.
	//
	// 캔버스 안의 탭은 엔진이 자기 루프에서 처리하므로 GDScript 에서 이 API 를 부르면 이미
	// 제스처 밖이다(그러면 브라우저가 거부한다). 그래서 **DOM 핸들러 안에서** 여기가 건다.
	// `once: true` — 첫 제스처 한 번이면 된다. 오디오는 엔진이 같은 입력에서 알아서 푼다.
	window.addEventListener('pointerdown', async () => {
		const info = document.getElementById('build-info');
		if (info) { info.remove(); }        // 빌드 도장은 타이틀까지만 — 플레이 중에는 안 남는다
		try {
			if (document.documentElement.requestFullscreen) {
				await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
			} else if (document.documentElement.webkitRequestFullscreen) {
				document.documentElement.webkitRequestFullscreen();
			}
		} catch (e) { /* iOS Safari 등 미지원 — 홈화면 추가로 대체된다 */ }
		try { await screen.orientation.lock('portrait'); } catch (e) { /* 지원 안 하면 무시 */ }
	}, { once: true });
}());
	</script>
</body>
</html>
